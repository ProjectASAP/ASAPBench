[package]
name = "aqpbm-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The benchmark framework: everything needed to measure a sketch, nothing that knows which sketches exist. Turns a row's build/insert/ask closures into timed bodies (ops), holds the clock (measure), scores against exact answers (accuracy), materialises datasets, and owns the JSONL report schema. Its `harness` module measures a whole engine under test (an in-process planner and executor, or an external server): the engine traits, the measurement protocol, the machine key, model fitting, accuracy curves, data statistics, run records, gate and sweep arithmetic, a fake-clock engine and the conformance kit every engine adapter runs. Names no sketch algorithm — the wrapped implementations live in sketch-bench — and with `default-features = false` depends on no sketch library, no polars, no CLI crate and no planner."

[features]
# Back the `LatencyRecorder` with a real hdrhistogram. Off → it
# is a counter-only shim and `hdrhistogram` is not linked. On by
# default so `sketch-bench` and `sketch-runtime` behave as they
# did when the recorder lived in `sketch-bench`; embedded
# consumers that want neither can take aqpbm-core with
# `default-features = false`.
default = ["hdrhist"]
hdrhist = ["dep:hdrhistogram"]
# Enable tikv-jemalloc-ctl `stats.allocated` sampling in the
# `memory` recorder. Forces jemalloc on the linking binary —
# opt-in only. Off → heap_allocated_kb = None.
heap-jemalloc = ["dep:tikv-jemalloc-ctl"]
# Compile in the per-sketch tracking allocator (metrics/heap_track.rs).
# The linking binary still has to install `TrackingAllocator` as
# its `#[global_allocator]` for counters to advance — see
# `aqpbm-cli`'s allocator setup. Off → heap_bytes_* = None.
heap-track = []
# Derive `JsonSchema` on the report types, enabling the export behind
# `schema_export_is_current`. Off by default so the proc-macro stays out
# of the embedded build: nothing at runtime needs it. Forwards to
# aqpbm-datagen, whose `TableDescription` is the record's `workload`.
schema = ["dep:schemars", "aqpbm-datagen/schema"]

[dependencies]
aqpbm-datagen.workspace = true
# `dataset` surfaces "cannot materialise this dataset" as an `anyhow` error,
# which `RunError::Dataset` carries.
anyhow.workspace = true
bitflags.workspace = true
hdrhistogram = { workspace = true, optional = true }
# Fixed-seed shuffle of the frequency comparator's probe set, so probe
# order is reproducible.
rand = { workspace = true }
rand_xoshiro = { workspace = true }
# `rc`: the harness's samples share their series labels through `Arc<SeriesLabels>`.
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true
schemars = { workspace = true, optional = true }
chrono.workspace = true
thiserror.workspace = true
tikv-jemalloc-ctl = { workspace = true, optional = true }

# `metrics::time` reads CPU time via `getrusage`.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

# Runs on the process's main thread (no libtest harness), so the thread the
# test pins is the one whose affinity it then reads.
[[test]]
name = "harness_pin_main_thread"
harness = false
