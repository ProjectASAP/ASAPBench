[package]
name = "aqpbm-harness"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Engine-neutral measurement harness: the traits an engine under test implements, the measurement protocol (pinning, idle check, warm-up, median of N), the machine key, model fitting with leave-one-setting-out, accuracy curves, data statistics, run records, gate and sweep arithmetic, a fake-clock engine and the conformance kit every engine adapter runs. Depends on no sketch library, no polars, no CLI crate and no planner."

[dependencies]
aqpbm-core.workspace = true
aqpbm-datagen.workspace = true
chrono.workspace = true
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true
thiserror.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
rand.workspace = true
rand_xoshiro.workspace = true
